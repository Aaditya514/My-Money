<div
  *ngIf="state.isOpen"
  class="dialog-backdrop animate-fade-in"
  (click)="onBackdropClick($event)"
  role="alertdialog"
  aria-modal="true"
  aria-labelledby="dialogTitle"
  aria-describedby="dialogDesc"
>
  <div class="dialog-card animate-scale-in" [ngClass]="'dialog-type-' + state.type">
    <!-- Drag / Bottom-sheet pill for mobile swipe indicator -->
    <div class="sheet-pill mobile-only"></div>

    <div class="dialog-body">
      <!-- Icon Container -->
      <div class="dialog-icon-wrapper" [ngClass]="'icon-' + state.type">
        <!-- Trash / Delete Icon -->
        <svg *ngIf="state.icon === 'trash'" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>

        <!-- Alert / Warning Icon -->
        <svg *ngIf="state.icon === 'alert'" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>

        <!-- Logout Icon -->
        <svg *ngIf="state.icon === 'logout'" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>

        <!-- Key Icon -->
        <svg *ngIf="state.icon === 'key'" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 2l-2 2m-1.5 1.5L14 9l-1.5-1.5L10 10l1.5 1.5L9 14l-2-2-5 5v3h3l5-5-2-2 2.5-2.5L12 12l2.5-2.5 1.5 1.5L19 8l1.5-1.5L22 5l-1-3z"></path>
        </svg>

        <!-- Info Icon -->
        <svg *ngIf="state.icon === 'info'" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>

        <!-- Question / Primary Icon -->
        <svg *ngIf="state.icon === 'question'" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
      </div>

      <!-- Text Content -->
      <div class="dialog-text">
        <h3 id="dialogTitle" class="dialog-title">{{ state.title }}</h3>
        <p id="dialogDesc" class="dialog-message">{{ state.message }}</p>
      </div>

      <!-- Action Buttons -->
      <div class="dialog-actions">
        <button
          type="button"
          class="btn btn-secondary dialog-btn dialog-btn-cancel"
          (click)="onCancel()"
          *ngIf="!state.isAlertOnly"
        >
          {{ state.cancelText || 'Cancel' }}
        </button>

        <button
          type="button"
          class="btn dialog-btn dialog-btn-confirm"
          [ngClass]="state.type === 'danger' ? 'btn-danger' : 'btn-primary'"
          (click)="onConfirm()"
          autofocus
        >
          {{ state.confirmText || 'Confirm' }}
        </button>
      </div>
    </div>
  </div>
</div>
