<div class="auth-wrapper animate-fade-in">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo-box mb-3" aria-hidden="true">
        <svg class="ic" style="width:24px; height:24px; stroke-width:2.2"><use href="#i-layers"></use></svg>
      </div>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to manage your financial ledger and budgets.</p>
    </div>

    <!-- Prototype Banner Alert -->
    <div *ngIf="errorMessage" class="banner r mb-3" role="alert">
      <svg class="ic s" style="margin-top:2px"><use href="#i-alert"></use></svg>
      <div class="banner-text">{{ errorMessage }}</div>
      <button type="button" class="banner-close" (click)="errorMessage = ''" aria-label="Dismiss alert">&times;</button>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      <!-- Phone Number or Email Field -->
      <div class="mb-3">
        <label for="l-id" class="lb">Phone number or email</label>
        <input
          id="l-id"
          class="inp"
          [class.bad]="isFieldInvalid('email')"
          type="text"
          formControlName="email"
          placeholder="9876543210 or name@example.com"
          autocomplete="username"
        />
        <div *ngIf="isFieldInvalid('email')" class="err" role="alert">
          <span *ngIf="loginForm.get('email')?.errors?.['required']">Enter your phone number or email.</span>
        </div>
      </div>

      <!-- Password Field with Show/Hide Toggle -->
      <div class="mb-4">
        <label for="l-pw" class="lb">Password</label>
        <div class="pw">
          <input
            id="l-pw"
            class="inp"
            [class.bad]="isFieldInvalid('password')"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Your password"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="pw-toggle"
            (click)="showPassword = !showPassword"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          >
            <svg class="ic"><use [attr.href]="showPassword ? '#i-eyeoff' : '#i-eye'"></use></svg>
          </button>
        </div>
        <div *ngIf="isFieldInvalid('password')" class="err" role="alert">
          <span *ngIf="loginForm.get('password')?.errors?.['required']">Enter your password.</span>
        </div>
      </div>

      <button type="submit" class="btn btn-full" [disabled]="loading">
        <span *ngIf="!loading">Sign in</span>
        <span *ngIf="loading" class="d-inline-flex align-items-center gap-2">
          <span class="spinner-border spinner-border-sm" role="status" style="width:16px;height:16px;border-width:2px;"></span>
          Signing in...
        </span>
      </button>
    </form>

    <div class="foot sub text-center mt-4">
      Don't have an account? <a routerLink="/register" class="lnk fw-semibold">Sign up</a>
    </div>
  </div>
</div>
