services:
  # =============================================================
  # 1. Spring Boot Backend Web Service (Docker on Render)
  # =============================================================
  - type: web
    name: finance-tracker-backend
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        sync: false # Paste your existing Render DB URL or free Neon / Supabase Postgres URL
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        value: "+19124931390"
      - key: BREVO_API_KEY
        value: "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"
      - key: BREVO_SENDER_EMAIL
        value: "ghostrider121322@gmail.com"
      - key: BREVO_SENDER_NAME
        value: "Finance Tracker"


  # =============================================================
  # 2. Angular 18 Frontend Static Site (Render Static Site)
  # =============================================================
  - type: web
    name: finance-tracker-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist/finance-tracker-frontend/browser
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
