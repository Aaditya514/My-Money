services:
  # =============================================================
  # 1. Spring Boot Backend Web Service (Docker on Render)
  # =============================================================
  - type: web
    name: finance-tracker-backend
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/categories
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: finance-tracker-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false

  # =============================================================
  # 2. Angular 18 Frontend Static Site (Render Static Site)
  # =============================================================
  - type: web
    name: finance-tracker-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist/finance-tracker-frontend/browser
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # =============================================================
  # 3. Managed PostgreSQL Database (Render Free Tier)
  # =============================================================
  - name: finance-tracker-db
    databaseName: finance_db
    user: postgres
    plan: free
    region: oregon
